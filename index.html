<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mubarak JR | Cyber Key Panel</title>
<style>
:root{--bg:#05090d;--panel:#0b151b;--line:#123b37;--green:#43ffb0;--cyan:#38e8ff;--muted:#8aa7a2;--red:#ff657a}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#10332c 0%,#071116 42%,#030609 100%);color:#eafff7;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:22px}.wrap{width:min(100%,520px)}.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}.logo{width:58px;height:58px;border:1px solid var(--green);border-radius:16px;display:grid;place-items:center;background:#0c2923;box-shadow:0 0 24px #43ffb033;color:var(--green);font-weight:950;font-size:20px;letter-spacing:-2px}.brand{font-size:23px;font-weight:900;letter-spacing:1px}.brand span{color:var(--green)}.sub{font-size:11px;letter-spacing:3px;color:var(--muted);margin-top:3px}.panel{border:1px solid #1a5146;border-radius:22px;background:linear-gradient(155deg,#0c1c20ee,#071015f5);padding:22px;box-shadow:0 20px 70px #0009,0 0 30px #20ffad0b}.status{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;letter-spacing:1px}.online{color:var(--green)}.clock{font-size:clamp(27px,8vw,39px);font-weight:800;letter-spacing:2px;margin:12px 0 2px;font-variant-numeric:tabular-nums}.date{font-size:12px;color:var(--muted)}.divider{height:1px;background:linear-gradient(90deg,transparent,#1c5147,transparent);margin:20px 0}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{border:1px solid #173b36;background:#071116;border-radius:14px;padding:13px}.label{font-size:10px;letter-spacing:1.8px;color:var(--muted)}.value{font-weight:800;font-size:17px;margin-top:7px;color:var(--green)}button{width:100%;border-radius:12px;border:1px solid #2a8067;padding:15px 14px;color:#04120d;font-weight:900;letter-spacing:1.3px;font-size:13px;cursor:pointer;background:linear-gradient(100deg,var(--green),#9bffd8);box-shadow:0 5px 20px #43ffb022;transition:transform .15s,filter .15s}button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:wait}.secondary{margin-top:10px;background:#0b1d21;color:#c9fff0;border-color:#24554d;box-shadow:none}.keybox{display:none;margin-top:14px;border:1px dashed #27705d;border-radius:12px;padding:12px;background:#06110f}.keytitle{font-size:10px;letter-spacing:2px;color:var(--muted);margin-bottom:8px}.keytext{font-family:ui-monospace,monospace;font-size:17px;overflow-wrap:anywhere;color:var(--cyan);font-weight:800}.message{min-height:20px;margin-top:12px;font-size:12px;color:var(--muted);text-align:center}.footer{text-align:center;color:#58756f;font-size:10px;letter-spacing:1.5px;margin-top:16px}.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);margin-right:7px}.success{animation:pop .35s ease}@keyframes pop{0%{transform:scale(.96);filter:brightness(1)}50%{transform:scale(1.02);filter:brightness(1.6)}100%{transform:scale(1);filter:brightness(1)}}
</style></head>
<body><main class="wrap">
<header class="top"><div class="logo">MJ<span style="color:#eafff7">R</span></div><div><div class="brand">MUBARAK <span>JR</span></div><div class="sub">CYBER LICENSE CONSOLE</div></div></header>
<section class="panel">
<div class="status"><span><i class="pulse"></i>SYSTEM STATUS</span><span class="online" id="status">READY</span></div>
<div class="clock" id="clock">--:--:--</div><div class="date" id="date">Loading local time…</div>
<div class="divider"></div>
<div class="stats"><div class="stat"><div class="label">KEY DURATION</div><div class="value">12 HOURS</div></div><div class="stat"><div class="label">DEVICE LIMIT</div><div class="value">01 DEVICE</div></div></div>
<div class="divider"></div>
<button id="generate" type="button">↗ VERIFY & CONTINUE</button>
<button id="returnSteps" class="secondary" type="button" style="display:none">↗ RETURN TO STEPS</button>
<div id="timerBox" class="stat" style="display:none;margin-top:12px;text-align:center"><div class="label">UNLOCK TIMER</div><div class="value" id="timerText">3 seconds</div></div>
<button id="copyAgain" class="secondary" type="button" disabled>▣ COPY LAST KEY AGAIN</button>
<div class="keybox" id="keybox"><div class="keytitle">GENERATED LICENSE KEY</div><div class="keytext" id="keytext"></div></div>
<div class="message" id="message" aria-live="polite">Ready to generate a license key.</div>
</section><div class="footer">MUBARAK JR · CYBER MODE · REALTIME DATABASE</div>
</main>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script><script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
'use strict';
const DATABASE_URL='https://football-vote-web-default-rtdb.firebaseio.com/';
const SHORT_LINK_URL='https://vplink.in/BB7I';
const VERIFY_PARAM='verified', VERIFY_VALUE='1';
const VERIFY_SESSION='mjr_verified_once', GENERATED_SESSION='mjr_key_generated_once';
const $=id=>document.getElementById(id);let lastKey='';let isGenerating=false;let hasGenerated=false;let unlocked=false;
function isVerifiedReturn(){return new URLSearchParams(location.search).get(VERIFY_PARAM)===VERIFY_VALUE;}
function beginVerification(){location.href=SHORT_LINK_URL;}
function showReturnSteps(){ $('generate').style.display='none'; $('returnSteps').style.display='block'; $('timerBox').style.display='none'; $('status').textContent='RETURN REQUIRED'; $('message').textContent='Page refreshed. Tap RETURN TO STEPS to open the verification link again.'; }
function startUnlockTimer(){ $('returnSteps').style.display='none'; $('generate').style.display='block'; $('generate').disabled=true; $('generate').textContent='PLEASE WAIT…'; $('timerBox').style.display='block'; $('status').textContent='VERIFIED'; let left=3; $('timerText').textContent=left+' seconds'; $('message').textContent='Verification return detected. Key generation unlocks in 3 seconds.'; const tick=()=>{left--; if(left<=0){unlocked=true; $('timerBox').style.display='none'; $('generate').disabled=false; $('generate').textContent='⚡ GENERATE & COPY KEY'; $('status').textContent='UNLOCKED'; $('message').textContent='✓ Timer complete. You can now generate one key.'; return;} $('timerText').textContent=left+' second'+(left===1?'':'s'); setTimeout(tick,1000);}; setTimeout(tick,1000); }
function initVerification(){if(isVerifiedReturn()){sessionStorage.setItem(VERIFY_SESSION,'1');try{history.replaceState({},document.title,location.origin+location.pathname);}catch(e){} if(sessionStorage.getItem(GENERATED_SESSION)==='1'){showReturnSteps();}else{startUnlockTimer();}}else if(sessionStorage.getItem(VERIFY_SESSION)==='1'){showReturnSteps();}else{ $('generate').textContent='↗ VERIFY & CONTINUE'; $('message').textContent='Tap VERIFY & CONTINUE to open the verification link.'; $('status').textContent='VERIFY FIRST'; }}
function updateClock(){const now=new Date();$('clock').textContent=now.toLocaleTimeString('en-GB',{hour12:false});$('date').textContent=now.toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'short',day:'numeric'});}
updateClock();setInterval(updateClock,1000);
function makeKey(){const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const part=()=>Array.from({length:4},()=>chars[Math.floor(Math.random()*chars.length)]).join('');return 'MJR-'+part()+'-'+part()+'-'+part();}
async function copyText(value){if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value);return;}const ta=document.createElement('textarea');ta.value=value;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('Clipboard access was blocked by this browser.');}
let dbReady=false,licensesRef;
try{if(!firebase.apps.length)firebase.initializeApp({databaseURL:DATABASE_URL});licensesRef=firebase.database().ref('licenses');dbReady=true;}catch(e){$('status').textContent='OFFLINE';}
async function generate(){const btn=$('generate');if(!sessionStorage.getItem(VERIFY_SESSION)){beginVerification();return;}if(!unlocked){$('message').textContent='Please wait for the 3-second timer to finish.';return;}if(isGenerating||hasGenerated){$('message').style.color='var(--muted)';$('message').textContent=hasGenerated?'✓ A key has already been generated. Use COPY LAST KEY AGAIN instead.':'Please wait — key generation is in progress.';return;}isGenerating=true;btn.disabled=true;$('status').textContent='WORKING';$('message').style.color='var(--muted)';$('message').textContent='Generating a unique key…';try{if(!dbReady)throw new Error('Firebase could not initialize.');let key=null;for(let i=0;i<8;i++){const candidate=makeKey();const candidateRef=licensesRef.child(candidate);const result=await candidateRef.transaction(current=>current===null?{status:'active',duration:12,durationUnit:'hours',deviceLimit:1,devices:{},createdAt:firebase.database.ServerValue.TIMESTAMP,startedAt:0,expiresAt:0,note:'Mubarak JR',lastLogin:0,lastDevice:''}:undefined);if(result.committed){key=candidate;break;}}if(!key)throw new Error('Could not reserve a unique key. Try again.');lastKey=key;hasGenerated=true;sessionStorage.setItem(GENERATED_SESSION,'1');$('keytext').textContent=key;$('keybox').style.display='block';$('copyAgain').disabled=false;$('status').textContent='SUCCESS';$('message').style.color='var(--green)';$('generate').textContent='✓ KEY GENERATED';$('generate').classList.remove('success');void $('generate').offsetWidth;$('generate').classList.add('success');try{await copyText(key);$('message').textContent='✓ Key generated and copied to clipboard.';$('generate').textContent='✓ GENERATED & COPIED';}catch(copyError){$('message').textContent='✓ Key generated. Clipboard blocked by this viewer — tap and hold the key above to copy it.';}setTimeout(()=>{$('generate').textContent='⚡ GENERATE & COPY KEY';$('generate').classList.remove('success');},1800);}catch(e){$('status').textContent='ERROR';$('message').style.color='var(--red)';$('message').textContent='Key generation failed: '+(e&&e.message?e.message:'Unknown error')+' — check Firebase connection/Rules.';}finally{isGenerating=false;if(!hasGenerated)btn.disabled=false;else{btn.disabled=true;btn.textContent='✓ KEY ALREADY GENERATED';}if($('status').textContent==='WORKING')$('status').textContent='READY';}}
$('generate').addEventListener('click',generate);
$('returnSteps').addEventListener('click',()=>{sessionStorage.removeItem(VERIFY_SESSION);sessionStorage.removeItem(GENERATED_SESSION);location.href=SHORT_LINK_URL;});
initVerification();$('copyAgain').addEventListener('click',async()=>{if(!lastKey)return;try{await copyText(lastKey);$('message').style.color='var(--green)';$('message').textContent='✓ Last key copied again.';$('status').textContent='COPIED';}catch(e){$('status').textContent='KEY READY';$('message').style.color='var(--muted)';$('message').textContent='Clipboard is blocked in this viewer. Tap and hold the key above, then choose Copy.';}});$('keytext').addEventListener('click',async()=>{if(!lastKey)return;try{await copyText(lastKey);$('message').style.color='var(--green)';$('message').textContent='✓ Key copied.';}catch(e){$('message').style.color='var(--muted)';$('message').textContent='Tap and hold the key text, then choose Copy.';}});
</script></body></html>
